<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小田园</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8, #ffe8e8);
            min-height: 100vh;
            padding: 20px;
        }
        /* 顶部导航 */
        .navbar {
            text-align: center;
            padding: 20px 0;
            color: #333;
        }
        .navbar h1 {
            font-size: 24px;
            font-weight: 500;
        }
        .navbar .domain {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        /* 功能按钮 */
        .music-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 30px;
            cursor: pointer;
        }
        /* 个人信息卡片 */
        .profile-card {
            background: rgba(255,255,255,0.9);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }
        /* 不规则圆形头像 */
        .avatar {
            width: 300px;
            height: 300px;
            margin: 0 auto 20px;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            overflow: hidden;
            border: 3px solid #fff;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 定位标签 */
        .location-tag {
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .location-tag .label {
            font-size: 18px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .location-tag .content {
            font-size: 22px;
            font-weight: 600;
            margin-top: 5px;
        }
        /* 文本信息 */
        .welcome-text {
            background: rgba(230,230,230,0.5);
            display: inline-block;
            padding: 8px 15px;
            border-radius: 16px;
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        .name {
            font-size: 60px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 15px;
        }
        .bio {
            font-size: 20px;
            color: #444;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="navbar">
        <h1>我的小田园</h1>
        <div class="domain">myhome.cc</div>
    </div>

    <!-- 背景音乐按钮 -->
    <button class="music-btn">背景音乐<br>点击播放</button>

    <!-- 个人信息卡片 -->
    <div class="profile-card">
        <div class="avatar">
            <!-- 替换成你的头像图片链接 -->
            <img src="https://via.placeholder.com/300" alt="头像">
        </div>

        <div class="location-tag">
            <div class="label">NOW BASED IN</div>
            <div class="content">江南大学</div>
        </div>

        <div class="welcome-text">你好，欢迎来到我的主页</div>
        <div class="name">你的昵称</div>
        <div class="bio">你的MBTI，平时XX，偶尔XX，保持热爱</div>
    </div>
</body>
</html>
