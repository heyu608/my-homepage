<!DOCTYPE html>
<html>
<body>
  <h3>20以内3的倍数统计结果</h3>
  <p id="result"></p>
  <script>
    let sum = 0;
    let count = 0;
    let multiples = [];

   
    for (let i = 1; i <= 20; i++) {
      if (i % 3 === 0) {
        sum += i;
        count++;
        multiples.push(i);
      }
    }

   
    const resultText = `
      具体数字：${multiples.join('、')}<br>
      数字和：${sum}<br>
      数字个数：${count}
    `;
    document.getElementById('result').innerHTML = resultText;
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
  <input type="text" id="main" placeholder="主字符串" value="abcabcab">
  <input type="text" id="sub" placeholder="子字符串" value="ab">
  <button onclick="calc()">统计</button>
  <p id="res"></p>

  <script>
    
    const count = (mainStr, subStr) => {
      if (!subStr) return 0;
      let num = 0, pos = 0;
      while ((pos = mainStr.indexOf(subStr, pos)) !== -1) {
        num++;
        pos += subStr.length;
      }
      return num;
    };

    
    function calc() {
      const main = document.getElementById('main').value;
      const sub = document.getElementById('sub').value;
      document.getElementById('res').textContent = `出现次数：${count(main, sub)}`;
    }
  </script>
</body>
</html>
