
主串：<input id="main" value="abcabcabc">
子串：<input id="sub" value="abc">
<button onclick="showCount()">统计次数</button>
<p>子串出现次数：<span id="result">0</span></p>

<script>

const countSubStr = (mainStr, subStr) => {
  if (!subStr) return 0;
  let num = 0, pos = 0;
  while ((pos = mainStr.indexOf(subStr, pos)) !== -1) {
    num++;
    pos += subStr.length;
  }
  return num;
};


function showCount() {
  const mainVal = document.getElementById('main').value;
  const subVal = document.getElementById('sub').value;
  const total = countSubStr(mainVal, subVal);
  document.getElementById('result').textContent = total; // 直接更新网页元素内容
}

showCount();
</script>
